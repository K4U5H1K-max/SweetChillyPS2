services:

  api:
    build: .
    ports:
      - "8000:8000"

    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+asyncpg://die_user:die_password@postgres:5432/die_db

    volumes:
      - ./data/uploads:/app/data/uploads
      - ./app:/app/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    depends_on:
      - qdrant
      - postgres

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=die_user
      - POSTGRES_PASSWORD=die_password
      - POSTGRES_DB=die_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  postgres_data: